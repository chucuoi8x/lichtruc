<script>(function (root) {

    return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1);
  }
  const defaults = [
    ['quang','QUANG','#49796B'],['dung-em','DŨNG EM','#A67146'],['lam','LÂM','#6B73A5'],
    ['luc','LỰC','#A96E7A'],['dung','DŨNG','#5C819A'],['thuc','THỨC','#8E8156'],['linh','LINH','#8973A1']
  ];
  function createState(initialKey) {
    const key = initialKey || adjacentMonth(new Date().toISOString().slice(0,7),1);
    return {schema:1,teamName:'Phòng CNTT',viewMonth:key,
      people:defaults.map(([id,name,color])=>({id,name,color,active:true,blockedWeekdays:id==='dung'?[6,0]:[],offDates:[]})),
      settings:{mode:'progressive',restDays:1,anchorDate:key+'-01',startPersonId:'quang'},months:{}};
  }
  function personProblem(person,date) {
    if (!person) return 'Không tìm thấy nhân sự';
    if (!person.active) return 'Nhân sự đang tạm ngừng';
    if (person.blockedWeekdays.includes(weekday(date))) return 'Trùng thứ không trực';
    if (person.offDates.includes(date)) return 'Trùng ngày nghỉ';
    return '';
  }
  function historical(state,key) {
    const counts = {}, weekends = {}, last = {};
    state.people.forEach(p=>{counts[p.id]=0;weekends[p.id]=0;});
    Object.keys(state.months).filter(k=>k<key).sort().forEach(k=> {
      state.months[k].entries.forEach(e=> {
        if (!e.personId) return;
        counts[e.personId]=(counts[e.personId]||0)+1;
        weekends[e.personId]=(weekends[e.personId]||0)+(isWeekend(e.date)?1:0);
        last[e.personId]=Math.max(last[e.personId]??-Infinity,dayNumber(e.date));
      });
    });
    return {counts,weekends,last};
  }
  function generate(state,key,options={}) {
    const active=state.people.filter(p=>p.active), dates=monthDates(key), old=state.months[key];
    const locks=Object.fromEntries((old?.entries||[]).filter(e=>e.locked).map(e=>[e.date,e]));
    const hist=historical(state,key), rest=state.settings.restDays;
    const start=Math.max(0,active.findIndex(p=>p.id===state.settings.startPersonId));
    const anchor=dayNumber(state.settings.anchorDate);
    const future = Object.values(state.months).flatMap(m=>m.entries).filter(e=>e.personId&&e.date>dates.at(-1)&&dayNumber(e.date)-dayNumber(dates.at(-1))<=rest);
    const lockedAhead=Object.values(locks).filter(e=>e.personId).concat(future);
    let serial=0;
    let beam=[{score:0,entries:[],counts:{},weekends:{},last:{...hist.last},serial:serial++}];
    for (const date of dates) {

      const lock=locks[date], next=[];

          && day-(path.last[p.id]??-Infinity)>rest
          && !lockedAhead.some(e=>e.personId===p.id&&dayNumber(e.date)>day&&dayNumber(e.date)-day<=rest));

          const id=lock?lock.personId:(person?.id||'');

      if(reason) issues.push({date:e.date,type:'rule',message:reason+(e.locked?' (ca đã khóa)':'')});
      const near=neighbors.find(other=>other.date!==e.date&&other.personId===e.personId&&Math.abs(dayNumber(e.date)-dayNumber(other.date))<=rest);
      if(near) issues.push({date:e.date,type:'rest',message:'Chưa đủ '+rest+' ngày nghỉ giữa hai ca (gần '+near.date.split('-').reverse().join('/')+')'});

  }

    const entries=state.months[key]?.entries||[];

      const list=entries.filter(e=>e.personId===p.id);
      return {...p,total:list.length,weekend:list.filter(e=>isWeekend(e.date)).length,weekday:list.filter(e=>!isWeekend(e.date)).length,locked:list.filter(e=>e.locked).length};
    });
  }
  function validateImport(raw) {
    if(!raw||raw.schema!==1||!Array.isArray(raw.people)||raw.people.length<1||raw.people.length>80) throw new Error('Tệp không đúng định dạng sao lưu Lịch Trực (phiên bản 1).');
    const dateValid=s=>Number.isFinite(dayNumber(s));
    const ids=new Set();
    const people=raw.people.map((p,i)=> {
      if(!p||typeof p.id!=='string'||!/^[A-Za-z0-9_-]{1,80}$/.test(p.id)||['__proto__','constructor','prototype'].includes(p.id)||ids.has(p.id)||typeof p.name!=='string'||!p.name.trim()||p.name.length>80) throw new Error('Danh sách nhân sự không hợp lệ.');
      ids.add(p.id);
      return {id:p.id,name:p.name.trim(),active:p.active!==false,color:/^#[a-f\d]{6}$/i.test(p.color)?p.color:defaults[i%7][2],
        blockedWeekdays:[...new Set((Array.isArray(p.blockedWeekdays)?p.blockedWeekdays:[]).filter(n=>Number.isInteger(n)&&n>=0&&n<=6))],
        offDates:[...new Set((Array.isArray(p.offDates)?p.offDates:[]).filter(dateValid))].slice(0,2000)};
    });

    const settings={mode:s.mode==='balanced'?'balanced':'progressive',restDays:Number.isInteger(s.restDays)?Math.max(0,Math.min(14,s.restDays)):1,
      anchorDate,startPersonId:ids.has(s.startPersonId)?s.startPersonId:people[0].id};
    const months={};
    const source=raw.months&&typeof raw.months==='object'?raw.months:{};
    if(Object.keys(source).length>600) throw new Error('Tệp chứa quá nhiều tháng (tối đa 600 tháng).');

      if(!/^(19|20|21)\d\d-(0[1-9]|1[0-2])$/.test(key)||!value||!Array.isArray(value.entries)) throw new Error('Dữ liệu tháng không hợp lệ.');

      }).sort((a,b)=>a.date.localeCompare(b.date));
      months[key]={key,entries,generatedAt:typeof value.generatedAt==='string'?value.generatedAt:'',mode:value.mode==='balanced'?'balanced':'progressive'};
    }
    const viewMonth=/^(19|20|21)\d\d-(0[1-9]|1[0-2])$/.test(raw.viewMonth)?raw.viewMonth:anchorDate.slice(0,7);
    return {schema:1,teamName:typeof raw.teamName==='string'?raw.teamName.slice(0,120):'Phòng CNTT',viewMonth,people,settings,months};
  }

  root.RotaCore=api;
  if(typeof module!=='undefined') module.exports=api;
})(globalThis);

></section></div>'+footer();

  function render(){
    $('#main').innerHTML=tab==='calendar'?calendarPage():tab==='people'?peoplePage():tab==='stats'?statsPage():backupPage();
    document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});
    $('#breadcrumbTitle').textContent={calendar:'Lịch tháng',people:'Nhân sự & điều kiện',stats:'Thống kê',backup:'Sao lưu & hướng dẫn'}[tab];
    updateSaveStatus();
    $('#monthSelect')?.addEventListener('change',monthSelect);
    $('#yearSelect')?.addEventListener('change',monthSelect);
    $('#settingsForm')?.addEventListener('submit',e=>{
      e.preventDefault();const f=e.currentTarget;
      if(!Number.isFinite(C.dayNumber(f.anchorDate.value))){toast('Ngày bắt đầu chu kỳ chưa hợp lệ.',true);return;}
      state.teamName=f.teamName.value.trim()||'Phòng CNTT';
      state.settings={mode:f.mode.value,restDays:Number(f.restDays.value),anchorDate:f.anchorDate.value,startPersonId:f.startPerson.value||state.settings.startPersonId};
      save();render();toast('Đã lưu quy tắc. Tạo lại từng tháng để áp dụng.');
    });
  }
  function changeMonth(value){if(value<'1900-01'||value>'2199-12'){toast('Hỗ trợ lịch từ năm 1900 đến 2199.',true);return;}key=value;save();render();}
  function monthSelect(){changeMonth($('#yearSelect').value+'-'+$('#monthSelect').value.padStart(2,'0'));}
  function confirmDialog({title,body,button='Đồng ý',action,danger=false}){
    const el=$('#confirmDialog');

  function generateMonth(){
    if(busy)return;
    const run=()=>{
      busy=true;document.body.classList.add('busy');render();
      setTimeout(()=>{
        try{const result=C.generate(state,key);state.months[key]=result.month;save();render();
          toast(result.issues.length?'Đã xếp lịch. Còn '+new Set(result.issues.map(e=>e.date)).size+' ngày cần kiểm tra.':'Đã xếp xong tháng '+monthLabel(key)+'.',!!result.issues.length);
        }catch(e){toast('Chưa xếp được lịch: '+e.message,true);}
        finally{busy=false;document.body.classList.remove('busy');render();}
      },35);
    };
    const old=state.months[key];
    if(old){const count=old.entries.filter(e=>e.locked).length;confirmDialog({title:'Tạo lại lịch tháng '+monthLabel(key)+'?',body:'Công cụ sẽ xếp lại các ca chưa khóa theo điều kiện hiện tại. <strong>'+count+' ca đã khóa được giữ nguyên</strong>. Ghi chú theo ngày vẫn được giữ. Bạn có thể sao lưu trước nếu muốn giữ bản hiện tại.',button:'Tạo lại lịch',action:run});}
    else run();
  }
  function ensureMonth(){if(!state.months[key])state.months[key]={key,entries:C.monthDates(key).map(date=>({date,personId:'',locked:false,note:''})),generatedAt:'',mode:state.settings.mode};return state.months[key];}
  function openDay(date){
    const old=state.months[key]?.entries.find(e=>e.date===date)||{date,personId:'',locked:false,note:''},el=$('#editDialog');
    el.innerHTML='<div class="dialog-head"><div><h2 id="editTitle">'+longDay(date)+', '+dateLabel(date)+'</h2><small>Âm lịch: '+esc(L.describe(date))+'</small></div><button class="btn subtle icon" data-close aria-label="Đóng">'+I('close')+'</button></div><form id="dayForm"><div class="dialog-body"><div class="field"><label for="dayPerson">Người tiếp nhận</label><select id="dayPerson" name="personId"><option value="">— Chưa phân công —</option>'+state.people.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===old.personId?'selected':'')+'>'+esc(p.name)+(C.personProblem(p,date)?' · '+esc(C.personProblem(p,date)):'')+'</option>').join('')+'</select></div><div class="field"><label for="dayNote">Ghi chú</label><textarea id="dayNote" name="note" maxlength="500" placeholder="Ghi chú hoặc lý do đổi ca…">'+esc(old.note)+'</textarea></div><label class="check-row"><input type="checkbox" name="locked" '+(old.locked||old.personId?'checked':'')+'><span>Khóa ca này<small>Giữ nguyên phân công khi tạo lại lịch tự động.</small></span></label><div id="dayRuleMessage"></div></div><div class="dialog-actions"><button type="button" class="btn" data-close>Hủy</button><button type="submit" class="btn primary">'+I('check')+'Lưu phân công</button></div></form>';
    el.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el.close());
    const preview=()=>{
      const form=$('#dayForm'),e={...old,personId:form.personId.value,locked:form.locked.checked};
      const entries=(state.months[key]?.entries||C.monthDates(key).map(d=>({date:d,personId:'',locked:false,note:''}))).map(a=>a.date===date?e:a);
      const mock={...state,months:{...state.months,[key]:{entries}}};
      const issues=C.validateMonth(mock,key).filter(x=>x.date===date);
      $('#dayRuleMessage').innerHTML=issues.length?'<div class="banner">'+I('alert')+'<p>'+issues.map(x=>esc(x.message)).join('<br>')+'. Bạn có thể lưu thủ công, nhưng nên kiểm tra trước khi chốt lịch.</p></div>':'';
    };
    $('#dayPerson').onchange=preview;
    $('#dayForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget,m=ensureMonth();m.entries=m.entries.map(a=>a.date===date?{date,personId:form.personId.value,locked:form.locked.checked,note:form.note.value.trim()}:a);save();el.close();render();toast('Đã lưu ca ngày '+dateLabel(date)+'.');};
    preview();el.showModal();
  }

    el.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el.close());

    }
    $('#addOffDate').onclick=()=>{const d=$('#offDateInput').value;if(!Number.isFinite(C.dayNumber(d))||d<'1900-01-01'||d>'2199-12-31'){toast('Chọn ngày nghỉ hợp lệ.',true);return;}if(!draft.offDates.includes(d))draft.offDates.push(d);renderOffDates();};

      if(!name){toast('Vui lòng nhập tên nhân sự.',true);return;}
      if(state.people.some(p=>p.id!==draft.id&&p.name.toLocaleUpperCase('vi-VN')===name)){toast('Tên này đã có. Hãy thêm ký hiệu để phân biệt.',true);return;}
      if(!existing&&state.people.length>=80){toast('Công cụ hỗ trợ tối đa 80 nhân sự.',true);return;}
      draft.name=name;draft.active=form.active.checked;
      if(existing)state.people=state.people.map(p=>p.id===draft.id?draft:p);else state.people.push(draft);
      if(!state.people.some(p=>p.active&&p.id===state.settings.startPersonId))state.settings.startPersonId=state.people.find(p=>p.active)?.id||state.people[0].id;
      save();el.close();render();toast('Đã lưu '+name+'. Lịch đã tạo giữ nguyên.');
    };
    renderOffDates();el.showModal();
  }
  function showIssues(){
    const issues=C.validateMonth(state,key),el=$('#issuesDialog');
    el.innerHTML='<div class="dialog-head"><h2 id="issuesTitle">Ngày cần kiểm tra</h2><button class="btn subtle icon" data-close aria-label="Đóng">'+I('close')+'</button></div><div class="dialog-body"><p class="help-copy">Chọn ngày để điều chỉnh ca. Nếu nhiều điều kiện cùng lúc, bạn có thể sửa điều kiện hoặc đổi phân công thủ công.</p><ul class="issues-list">'+issues.map(e=>'<li><button data-issue-date="'+e.date+'">'+dateLabel(e.date)+'</button>'+esc(e.message)+'</li>').join('')+'</ul></div>';
    el.querySelector('[data-close]').onclick=()=>el.close();el.querySelectorAll('[data-issue-date]').forEach(b=>b.onclick=()=>{el.close();openDay(b.dataset.issueDate);});el.showModal();
  }
  function exportExcel(){
    const available=Object.keys(state.months).sort();
    if(!available.length){toast('Hãy xếp và lưu ít nhất một tháng trước khi xuất Excel.',true);return;}
    let prefs={includeLunar:true,includeStats:true};
    try{const saved=JSON.parse(localStorage.getItem('lich-truc-export-v1')||'null');if(saved&&typeof saved==='object')prefs={includeLunar:saved.includeLunar!==false,includeStats:saved.includeStats!==false};}catch{}
    const el=$('#exportDialog'),hasCurrent=Object.hasOwn(state.months,key),initial=hasCurrent?key:available.at(-1);
    el.innerHTML='<div class="dialog-head"><div><h2 id="exportTitle">Xuất file Excel</h2><small>Chọn nội dung và các tháng cần xuất</small></div><button class="btn subtle icon" data-close aria-label="Đóng">'+I('close')+'</button></div><form id="exportForm"><div class="dialog-body"><div class="export-section-label">NỘI DUNG TRONG FILE</div><label class="check-row"><input type="checkbox" name="includeLunar" '+(prefs.includeLunar?'checked':'')+'><span>Hiển thị cột lịch âm<small>Bỏ chọn để file Excel chỉ có ngày dương.</small></span></label><label class="check-row"><input type="checkbox" name="includeStats" '+(prefs.includeStats?'checked':'')+'><span>Kèm sheet thống kê<small>Tổng ca, ca trong tuần và cuối tuần của các tháng đã chọn.</small></span></label><fieldset class="export-scope"><legend>THÁNG CẦN XUẤT</legend><label class="export-scope-option"><input type="radio" name="scope" value="current" '+(hasCurrent?'checked':'disabled')+'><span>Chỉ tháng đang xem — '+monthLabel(key)+'<small>'+(hasCurrent?'Xuất riêng lịch tháng này.':'Tháng này chưa có lịch. Chọn tháng đã lưu ở bên dưới.')+'</small></span></label><label class="export-scope-option"><input type="radio" name="scope" value="multiple" '+(!hasCurrent?'checked':'')+'><span>Chọn một hoặc nhiều tháng đã lưu<small>Mỗi tháng một sheet lịch trực, trong cùng một file Excel.</small></span></label></fieldset><div id="exportMonthPicker" '+(hasCurrent?'hidden':'')+'><div class="export-month-toolbar"><span>'+available.length+' tháng đã lưu</span><div><button type="button" class="btn subtle small" data-export-select="all">Chọn tất cả</button><button type="button" class="btn subtle small" data-export-select="none">Bỏ chọn</button></div></div><div class="export-month-grid">'+available.map(monthKey=>{const m=state.months[monthKey],count=m.entries.filter(e=>e.personId).length;return '<label class="export-month-option"><input type="checkbox" name="months" value="'+monthKey+'" '+(monthKey===initial?'checked':'')+'><span>Tháng '+monthLabel(monthKey)+(monthKey===key?'<em>Đang xem</em>':'')+'<small>'+count+'/'+m.entries.length+' ngày đã phân công</small></span></label>';}).join('')+'</div><p class="export-hint">Để thêm tháng chưa có trong danh sách, hãy xếp và lưu lịch tháng đó trước.</p></div><div id="exportSummary" class="export-summary" role="status" aria-live="polite"></div></div><div class="dialog-actions"><button type="button" class="btn" data-close>Hủy</button><button type="submit" id="exportSubmit" class="btn primary">'+I('download')+'Tải file Excel</button></div></form>';
    el.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el.close());
    const form=$('#exportForm');
    const selection=()=>form.elements.scope.value==='current'?(hasCurrent?[key]:[]):[...form.querySelectorAll('input[name="months"]:checked')].map(input=>input.value);
    const options=()=>({includeLunar:form.elements.includeLunar.checked,includeStats:form.elements.includeStats.checked});
    const update=()=>{
      $('#exportMonthPicker').hidden=form.elements.scope.value!=='multiple';
      const keys=selection(),opts=options();$('#exportSubmit').disabled=!keys.length;
      if(!keys.length){$('#exportSummary').innerHTML=I('info')+'<span>Hãy chọn ít nhất một tháng để xuất.</span>';return;}
      const names=E.sheetNames(state,keys,opts);
      $('#exportSummary').innerHTML=I('file')+'<div><strong>'+keys.length+' tháng · '+names.length+' sheet · '+(opts.includeLunar?'Có lịch âm':'Chỉ ngày dương')+'</strong><p>'+names.slice(0,8).map(esc).join(' · ')+(names.length>8?' · và '+(names.length-8)+' sheet khác':'')+'</p></div>';
    };
    form.addEventListener('change',update);
    el.querySelectorAll('[data-export-select]').forEach(b=>b.onclick=()=>{form.querySelectorAll('input[name="months"]').forEach(input=>{input.checked=b.dataset.exportSelect==='all';});update();});
    form.onsubmit=e=>{
      e.preventDefault();const selected=selection(),opts=options();
      try{
        const keys=E.selectedMonths(state,selected),sheets=E.sheets(state,keys,opts),first=keys[0].replace('-','_'),last=keys.at(-1).replace('-','_');
        const filename=keys.length===1?'Lich_truc_'+first+'.xlsx':'Lich_truc_'+keys.length+'_thang_'+first+'_'+last+'.xlsx';
        download(X.createWorkbook(sheets),filename,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        try{localStorage.setItem('lich-truc-export-v1',JSON.stringify(opts));}catch{}
        el.close();toast('Đã tạo Excel: '+keys.length+' tháng, '+sheets.length+' sheet'+(opts.includeLunar?', có lịch âm.':', chỉ ngày dương.'));
      }catch(error){toast('Chưa xuất được Excel: '+error.message,true);}
    };
    update();el.showModal();
  }
  function printMonth(){
    if(!state.months[key]){toast('Hãy tạo lịch tháng này trước khi in.',true);return;}
    $('#printArea').innerHTML=E.printHTML(state,key);
    window.print();
  }
  function exportBackup(){save();download(JSON.stringify(state,null,2),'Sao_luu_Lich_Truc_'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Đã tạo bản sao lưu đầy đủ.');}
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});return;}
    const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;
    if(a==='tab'){tab=v;render();window.scrollTo({top:0,behavior:'smooth'});}
    else if(a==='prev')changeMonth(C.adjacentMonth(key,-1));
    else if(a==='next')changeMonth(C.adjacentMonth(key,1));
    else if(a==='generate')generateMonth();
    else if(a==='view'){view=v;try{localStorage.setItem(UI_STORE,view);}catch{}render();}
    else if(a==='day')openDay(v);
    else if(a==='issues')showIssues();
    else if(a==='add-person')openPerson();
    else if(a==='edit-person')openPerson(v);
    else if(a==='toggle-person'){const p=person(v);p.active=!p.active;if(!p.active&&state.settings.startPersonId===p.id)state.settings.startPersonId=state.people.find(p=>p.active)?.id||state.people[0].id;save();render();toast(p.name+(p.active?' đã tham gia xếp lịch.':' đã tạm ngừng. Lịch đã tạo giữ nguyên.'));}
    else if(a==='move-up'||a==='move-down'){const i=state.people.findIndex(p=>p.id===v),j=i+(a==='move-up'?-1:1);if(j>=0&&j<state.people.length){[state.people[i],state.people[j]]=[state.people[j],state.people[i]];save();render();}}
    else if(a==='excel')exportExcel();
    else if(a==='print')printMonth();
    else if(a==='backup')exportBackup();
    else if(a==='restore')$('#backupInput').click();
  });
  $('#backupInput').addEventListener('change',async e=>{
    const file=e.target.files?.[0];if(!file)return;
    try{
      if(file.size>8*1024*1024)throw new Error('Tệp quá lớn. Dung lượng tối đa 8 MB.');
      const incoming=C.validateImport(JSON.parse(await file.text()));
      confirmDialog({title:'Khôi phục dữ liệu?',body:'Tệp chứa <strong>'+incoming.people.length+' nhân sự</strong> và <strong>'+Object.keys(incoming.months).length+' tháng</strong> của '+esc(incoming.teamName)+'. Toàn bộ dữ liệu hiện tại trong trình duyệt này sẽ được thay thế. Hãy tải bản sao lưu hiện tại trước nếu cần giữ lại.',button:'Khôi phục dữ liệu',danger:true,action:()=>{state=incoming;key=state.viewMonth;loadWarning='';save();tab='calendar';render();toast('Đã khôi phục nhân sự, quy tắc và lịch trực.');}});
    }catch(err){toast('Không đọc được bản sao lưu: '+err.message,true);}
    e.target.value='';
  });
  document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const rect=d.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)d.close();}}));
  if(!Object.keys(state.months).length&&!loadWarning){const result=C.generate(state,key);state.months[key]=result.month;save();}
  render();
})();
</script>
</body></html>
